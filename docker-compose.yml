services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-extractor
    ports:
      - "8003:8000"
    volumes:
      - extractor_data:/app/data
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/tickets.db
      - FLARESOLVERR_URL=http://flaresolverr:8191
    # FlareSolverr is optional now (Dhiraagu uses real headed Chrome, not
    # FlareSolverr), so don't block app startup on it — just start it alongside.
    depends_on:
      flaresolverr:
        condition: service_started
    restart: unless-stopped
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Indian/Maldives
    ports:
      - "8191:8191"
    restart: unless-stopped
    healthcheck:
      # FlareSolverr is Python-based, so use urllib (no curl/wget assumption).
      # Root "/" returns 200 once the solver is ready.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8191/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  extractor_data:
    name: ticket-extractor-data
