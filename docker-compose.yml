services:
  extractor:
    build: .
    container_name: ticket-extractor
    ports:
      - "8003:8000"
    volumes:
      - extractor_data:/app/data
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/tickets.db
    restart: unless-stopped
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  extractor_data:
    name: ticket-extractor-data
