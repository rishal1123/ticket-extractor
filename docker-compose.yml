services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-extractor
    # Stable hostname so Chrome's profile SingletonLock (which stores hostname-pid)
    # keeps the same hostname across container recreates. Without this, a recreate
    # gets a new random hostname and Chrome treats the old lock as "another
    # computer" and refuses to open the persistent profile (exit 21). entrypoint.sh
    # also clears stale Singleton* locks as the primary fix; this is belt-and-suspenders.
    hostname: ticket-extractor
    ports:
      - "8003:8000"
    volumes:
      - extractor_data:/app/data
    environment:
      - TZ=Indian/Maldives
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/tickets.db
      - FLARESOLVERR_URL=http://flaresolverr:8191
      # Drive Dhiraagu's Cloudflare-bound headed Chrome in the dedicated sidecar
      # over CDP. The app connects here instead of launching a local headed Chrome;
      # when this is set, the app skips its own Xvfb/noVNC entirely. Unset = local.
      - DHIRAAGU_BROWSER_CDP=dhiraagu-browser:9222
    # FlareSolverr is optional now (Dhiraagu uses real headed Chrome, not
    # FlareSolverr); the browser sidecar hosts Dhiraagu's Chrome. Don't block app
    # startup on either — just start them alongside.
    depends_on:
      flaresolverr:
        condition: service_started
      dhiraagu-browser:
        condition: service_started
    restart: unless-stopped
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Dedicated headed-Chrome sidecar for Dhiraagu's Cloudflare. Runs ONE real
  # Chrome under Xvfb+fluxbox, exposes CDP on :9222 (driven by the app) and noVNC
  # on :6080 (a human solves the challenge in the SAME window). Same image, just a
  # different entrypoint. MUST run on this host so Cloudflare sees the same egress
  # IP as before (cf_clearance is IP-bound).
  dhiraagu-browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhiraagu-browser
    hostname: dhiraagu-browser
    entrypoint: ["/app/browser-entrypoint.sh"]
    ports:
      # noVNC: open http://<host>:6080/vnc.html to watch/drive the headed Chrome
      # and solve a Cloudflare challenge by hand. Secure with VNC_PASSWORD.
      - "6080:6080"
    # CDP (:9222) is NOT published to the host — only the app needs it, over the
    # internal Docker network. Don't expose DevTools to the outside.
    expose:
      - "9222"
    volumes:
      - dhiraagu_profile:/profile
    environment:
      - TZ=Indian/Maldives
      # Password for the noVNC session. If unset, noVNC is OPEN with no auth —
      # set this (e.g. in a .env file or Portainer) when 6080 is reachable.
      - VNC_PASSWORD=${VNC_PASSWORD:-}
    restart: unless-stopped
    # Dhiraagu's Chrome (single tab, images on for Cloudflare) gets 2GB. Chrome
    # uses --disable-dev-shm-usage, so /dev/shm stays empty — keep shm small so it
    # can't eat into the 2GB cap.
    mem_limit: 2gb
    shm_size: '512m'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Indian/Maldives
    ports:
      - "8191:8191"
    restart: unless-stopped
    healthcheck:
      # FlareSolverr is Python-based, so use urllib (no curl/wget assumption).
      # Root "/" returns 200 once the solver is ready.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8191/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  extractor_data:
    name: ticket-extractor-data
  dhiraagu_profile:
    name: dhiraagu-browser-profile
