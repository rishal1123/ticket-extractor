version: '3.8'

services:
  extractor:
    build: .
    container_name: ticket-extractor
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./tickets.db:/app/tickets.db
      - ./.env:/app/.env:ro  # Mount .env file (read-only in container)
    env_file:
      - .env  # Load environment variables from .env file
    environment:
      # Override settings for container
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    shm_size: '2gb'  # Required for Chrome
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
