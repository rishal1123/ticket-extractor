<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Ticket shape with notches -->
  <rect x="5" y="6" width="22" height="20" rx="2.5" fill="#fff" opacity="0.95"/>
  <circle cx="5" cy="13" r="2.5" fill="url(#bg)"/>
  <circle cx="27" cy="13" r="2.5" fill="url(#bg)"/>
  <!-- Tear line -->
  <line x1="8" y1="13" x2="24" y2="13" stroke="#3498db" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.5"/>
  <!-- Top section: ticket ID lines -->
  <rect x="8.5" y="8.5" width="10" height="1.8" rx="0.9" fill="#2c3e50" opacity="0.8"/>
  <rect x="8.5" y="11" width="5" height="1" rx="0.5" fill="#3498db" opacity="0.5"/>
  <!-- Bottom section: extraction arrow -->
  <path d="M16 15.5 L16 22" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
  <path d="M12.5 19.5 L16 23 L19.5 19.5" stroke="#27ae60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
