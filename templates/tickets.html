<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tickets - Ticket Extractor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
        }
        body {
            background-color: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, #34495e 100%);
            padding: 0.75rem 1rem;
        }
        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 1.25rem;
        }
        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c757d;
            white-space: nowrap;
        }
        .table tbody td {
            vertical-align: middle;
            font-size: 0.9rem;
        }
        .badge-portal {
            font-size: 0.7rem;
            padding: 0.35em 0.65em;
            font-weight: 600;
        }
        .badge-dhiraagu { background-color: #e74c3c; }
        .badge-ooredoo { background-color: #9b59b6; }
        .badge-rol { background-color: #3498db; }
        .badge-medianet { background-color: #1abc9c; }
        .znuny-status {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .znuny-yes { color: var(--success-color); }
        .znuny-no { color: var(--danger-color); }
        .ticket-row {
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .ticket-row:hover {
            background-color: #f0f4f8 !important;
        }
        .ticket-row.completed {
            background-color: #f8f9fa;
            opacity: 0.7;
        }
        .modal-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #34495e 100%);
            color: white;
            padding: 1rem 1.5rem;
        }
        .modal-body {
            padding: 1.5rem;
        }
        .info-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            height: 100%;
        }
        .info-card .label {
            font-size: 0.75rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }
        .info-card .value {
            font-weight: 600;
            color: #2c3e50;
        }
        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .notes-container {
            max-height: 300px;
            overflow-y: auto;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.show {
            display: flex;
        }
        .time-badge {
            font-size: 0.75rem;
            padding: 0.25em 0.5em;
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control, .form-select {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-list-ul me-2"></i>
                All Tickets
            </span>
            <div class="d-flex align-items-center gap-2">
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house me-1"></i>Dashboard
                </a>
                <a href="/staff" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-people me-1"></i>Staff Stats
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <!-- Filters -->
        <div class="filter-section">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Ticket ID, customer, address...">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Portal</label>
                    <select class="form-select" id="portalFilter">
                        <option value="">All Portals</option>
                        <option value="dhiraagu">Dhiraagu</option>
                        <option value="ooredoo">Ooredoo</option>
                        <option value="rol">ROL</option>
                        <option value="medianet">Medianet</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="statusFilter">
                        <option value="">All Status</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Type</label>
                    <select class="form-select" id="typeFilter">
                        <option value="">All Types</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Completion</label>
                    <select class="form-select" id="completionFilter">
                        <option value="">All</option>
                        <option value="active">Active Only</option>
                        <option value="completed">Completed Only</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary w-100" onclick="loadTickets()">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Tickets Table -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Portal</th>
                            <th>Ticket ID</th>
                            <th>Customer</th>
                            <th>Address</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Portal Created</th>
                            <th>Znuny</th>
                            <th>Time to Create</th>
                            <th>Created By</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsTable">
                        <!-- Filled by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div class="text-muted small" id="paginationInfo">Showing 0 tickets</div>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Ticket Detail Modal -->
    <div class="modal fade" id="ticketModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-ticket-detailed me-2"></i>
                        <span id="modalTicketId">Ticket Details</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="ticketModalBody">
                    <!-- Filled by JavaScript -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" id="syncZnunyBtn">
                        <i class="bi bi-cloud-download me-1"></i>Sync Znuny Data
                    </button>
                    <button type="button" class="btn btn-primary" id="checkZnunyBtn">
                        <i class="bi bi-search me-1"></i>Check Znuny
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 0;
        const pageSize = 50;
        let currentTicketId = null;

        // Maldives timezone (UTC+5)
        const MVT_OFFSET = 5 * 60;

        function toMaldivesTime(dateStr) {
            if (!dateStr) return null;
            const date = new Date(dateStr);
            const utc = date.getTime() + (date.getTimezoneOffset() * 60000);
            return new Date(utc + (MVT_OFFSET * 60000));
        }

        function formatMaldivesDateTime(dateStr) {
            if (!dateStr) return '-';
            const mvtDate = toMaldivesTime(dateStr);
            return mvtDate.toLocaleString('en-GB', {
                day: '2-digit',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        function formatMaldivesDateTimeFull(dateStr) {
            if (!dateStr) return '-';
            const mvtDate = toMaldivesTime(dateStr);
            return mvtDate.toLocaleString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }) + ' MVT';
        }

        function formatTimeDiff(ms) {
            if (!ms || ms < 0) return '-';
            const minutes = Math.floor(ms / 60000);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}d ${hours % 24}h`;
            if (hours > 0) return `${hours}h ${minutes % 60}m`;
            return `${minutes}m`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFilterOptions();
            loadTickets();

            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadTickets();
            });
        });

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        async function loadFilterOptions() {
            try {
                const response = await fetch('/api/stats?include_completed=true');
                const stats = await response.json();

                const statusFilter = document.getElementById('statusFilter');
                statusFilter.innerHTML = '<option value="">All Status</option>';
                for (const status of Object.keys(stats.by_status || {})) {
                    statusFilter.innerHTML += `<option value="${status}">${status}</option>`;
                }

                const typeFilter = document.getElementById('typeFilter');
                typeFilter.innerHTML = '<option value="">All Types</option>';
                for (const type of Object.keys(stats.by_type || {})) {
                    typeFilter.innerHTML += `<option value="${type}">${type}</option>`;
                }
            } catch (error) {
                console.error('Error loading filter options:', error);
            }
        }

        async function loadTickets() {
            showLoading(true);
            try {
                const params = new URLSearchParams();

                const search = document.getElementById('searchInput').value;
                const portal = document.getElementById('portalFilter').value;
                const status = document.getElementById('statusFilter').value;
                const type = document.getElementById('typeFilter').value;
                const completion = document.getElementById('completionFilter').value;

                if (search) params.append('search', search);
                if (portal) params.append('portal', portal);
                if (status) params.append('status', status);
                if (type) params.append('ticket_type', type);

                if (completion === 'active') {
                    params.append('include_completed', 'false');
                } else if (completion === 'completed') {
                    params.append('completed_only', 'true');
                } else {
                    params.append('include_completed', 'true');
                }

                params.append('limit', pageSize);
                params.append('offset', currentPage * pageSize);

                const response = await fetch('/api/tickets?' + params.toString());
                const data = await response.json();

                renderTickets(data.tickets);
                renderPagination(data.total);

            } catch (error) {
                console.error('Error loading tickets:', error);
            } finally {
                showLoading(false);
            }
        }

        function renderTickets(tickets) {
            const tbody = document.getElementById('ticketsTable');
            tbody.innerHTML = '';

            if (tickets.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            No tickets found
                        </td>
                    </tr>
                `;
                return;
            }

            for (const ticket of tickets) {
                const row = document.createElement('tr');
                row.className = 'ticket-row' + (ticket.completed_at ? ' completed' : '');
                row.onclick = () => showTicketDetail(ticket.id);

                const znunyIcon = ticket.in_znuny
                    ? '<i class="bi bi-check-circle-fill znuny-yes"></i>'
                    : '<i class="bi bi-x-circle-fill znuny-no"></i>';

                let timeToCreate = '-';
                if (ticket.portal_created_at && ticket.znuny_created_at) {
                    const portalDate = new Date(ticket.portal_created_at);
                    const znunyDate = new Date(ticket.znuny_created_at);
                    const diffMs = znunyDate - portalDate;
                    timeToCreate = `<span class="badge bg-info time-badge">${formatTimeDiff(diffMs)}</span>`;
                }

                row.innerHTML = `
                    <td><span class="badge badge-portal badge-${ticket.portal}">${ticket.portal}</span></td>
                    <td><strong>${ticket.ticket_id}</strong></td>
                    <td class="text-truncate" style="max-width: 150px;" title="${ticket.customer_name || ''}">${ticket.customer_name || '-'}</td>
                    <td class="text-truncate" style="max-width: 180px;" title="${ticket.address || ''}">${ticket.address || '-'}</td>
                    <td>${ticket.ticket_type || '-'}</td>
                    <td>${ticket.status || '-'}</td>
                    <td><small>${formatMaldivesDateTime(ticket.portal_created_at)}</small></td>
                    <td class="znuny-status">${znunyIcon}</td>
                    <td>${timeToCreate}</td>
                    <td><small>${ticket.znuny_created_by || '-'}</small></td>
                `;
                tbody.appendChild(row);
            }
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const info = document.getElementById('paginationInfo');
            const start = currentPage * pageSize + 1;
            const end = Math.min((currentPage + 1) * pageSize, total);
            info.textContent = total > 0 ? `Showing ${start}-${end} of ${total}` : 'No tickets';

            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            pagination.innerHTML += `
                <li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">&laquo;</a>
                </li>
            `;

            for (let i = 0; i < totalPages && i < 5; i++) {
                pagination.innerHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="goToPage(${i})">${i + 1}</a>
                    </li>
                `;
            }

            pagination.innerHTML += `
                <li class="page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">&raquo;</a>
                </li>
            `;
        }

        function goToPage(page) {
            currentPage = page;
            loadTickets();
        }

        async function showTicketDetail(ticketId) {
            showLoading(true);
            currentTicketId = ticketId;

            try {
                const [ticketResponse, znunyResponse] = await Promise.all([
                    fetch(`/api/tickets/${ticketId}`),
                    fetch(`/api/tickets/${ticketId}/znuny-articles`)
                ]);

                const ticketData = await ticketResponse.json();
                const znunyData = await znunyResponse.json();

                const ticket = ticketData.ticket;
                const znunyArticles = znunyData.articles || [];

                document.getElementById('modalTicketId').textContent = `${ticket.portal.toUpperCase()} - ${ticket.ticket_id}`;

                // Calculate times
                let timeToCreate = '-';
                let timeToComplete = '-';
                if (ticket.portal_created_at && ticket.znuny_created_at) {
                    const diffMs = new Date(ticket.znuny_created_at) - new Date(ticket.portal_created_at);
                    timeToCreate = formatTimeDiff(diffMs);
                }
                if (ticket.znuny_created_at && ticket.completed_at) {
                    const diffMs = new Date(ticket.completed_at) - new Date(ticket.znuny_created_at);
                    timeToComplete = formatTimeDiff(diffMs);
                }

                // Build Znuny section
                let znunySection = '';
                if (ticket.in_znuny) {
                    znunySection = `
                        <div class="col-12 mt-3">
                            <div class="section-title"><i class="bi bi-box-arrow-in-right"></i> Znuny Details</div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-3">
                                    <div class="info-card">
                                        <div class="label">Znuny Ticket #</div>
                                        <div class="value">${ticket.znuny_ticket_id || '-'}</div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-card">
                                        <div class="label">Created By</div>
                                        <div class="value">${ticket.znuny_created_by || '-'}</div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-card">
                                        <div class="label">Time to Create</div>
                                        <div class="value">${timeToCreate !== '-' ? `<span class="badge bg-info">${timeToCreate}</span>` : '-'}</div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="info-card">
                                        <div class="label">Time to Complete</div>
                                        <div class="value">${timeToComplete !== '-' ? `<span class="badge bg-success">${timeToComplete}</span>` : '-'}</div>
                                    </div>
                                </div>
                            </div>
                            ${ticket.znuny_address ? `
                            <div class="alert alert-warning py-2 mb-3">
                                <i class="bi bi-geo-alt me-1"></i>
                                <strong>Znuny Address:</strong> ${escapeHtml(ticket.znuny_address)}
                            </div>
                            ` : ''}
                            ${znunyArticles.length > 0 ? `
                            <div class="section-title"><i class="bi bi-journal-text"></i> Znuny Articles (${znunyArticles.length})</div>
                            <div class="notes-container">
                                <div class="accordion" id="articlesAccordion">
                                    ${znunyArticles.map((a, idx) => `
                                        <div class="accordion-item">
                                            <h2 class="accordion-header">
                                                <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#article${idx}">
                                                    <span class="badge bg-secondary me-2">#${a.article_number}</span>
                                                    <span class="badge bg-${a.via === 'Internal' ? 'info' : a.via === 'Phone' ? 'warning' : 'secondary'} me-2">${a.via}</span>
                                                    <strong class="me-2">${escapeHtml(a.created_by || a.sender)}</strong>
                                                    <small class="text-muted ms-auto">${a.created_at_str || '-'}</small>
                                                </button>
                                            </h2>
                                            <div id="article${idx}" class="accordion-collapse collapse" data-bs-parent="#articlesAccordion">
                                                <div class="accordion-body py-2">
                                                    <p class="mb-1 small"><strong>Subject:</strong> ${escapeHtml(a.subject)}</p>
                                                    ${a.body ? `<pre class="bg-light p-2 rounded mb-0 small" style="white-space: pre-wrap;">${escapeHtml(a.body)}</pre>` : '<p class="text-muted small mb-0"><em>No content - click Sync Znuny Data</em></p>'}
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            ` : '<p class="text-muted small">No articles synced. Click "Sync Znuny Data" to fetch.</p>'}
                        </div>
                    `;
                }

                const body = document.getElementById('ticketModalBody');
                body.innerHTML = `
                    <div class="row g-3">
                        <!-- Ticket Info -->
                        <div class="col-md-6">
                            <div class="section-title"><i class="bi bi-info-circle"></i> Ticket Information</div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Portal</div>
                                        <div class="value"><span class="badge badge-portal badge-${ticket.portal}">${ticket.portal}</span></div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Ticket ID</div>
                                        <div class="value">${ticket.ticket_id}</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Account</div>
                                        <div class="value">${ticket.account || '-'}</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Type</div>
                                        <div class="value">${ticket.ticket_type || '-'}</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="info-card">
                                        <div class="label">Customer</div>
                                        <div class="value">${ticket.customer_name || '-'}</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="info-card">
                                        <div class="label">Address</div>
                                        <div class="value">${ticket.address || '-'}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Status & Timestamps -->
                        <div class="col-md-6">
                            <div class="section-title"><i class="bi bi-clock-history"></i> Status & Timestamps</div>
                            <div class="row g-2">
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Status</div>
                                        <div class="value">${ticket.status || '-'}</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">In Znuny</div>
                                        <div class="value">
                                            <span class="znuny-status ${ticket.in_znuny ? 'znuny-yes' : 'znuny-no'}">
                                                ${ticket.in_znuny ? '<i class="bi bi-check-circle-fill"></i> Yes' : '<i class="bi bi-x-circle-fill"></i> No'}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Portal Created</div>
                                        <div class="value small">${formatMaldivesDateTimeFull(ticket.portal_created_at)}</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Znuny Created</div>
                                        <div class="value small">${formatMaldivesDateTimeFull(ticket.znuny_created_at)}</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Last Updated</div>
                                        <div class="value small">${formatMaldivesDateTimeFull(ticket.updated_at)}</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="info-card">
                                        <div class="label">Completed</div>
                                        <div class="value small">${ticket.completed_at ? formatMaldivesDateTimeFull(ticket.completed_at) : '<span class="text-success">Active</span>'}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ${znunySection}
                        <!-- Portal Notes -->
                        <div class="col-12 mt-3">
                            <div class="section-title"><i class="bi bi-chat-left-text"></i> Portal Notes</div>
                            <div class="notes-container">
                                ${ticket.notes ? `<pre class="bg-light p-3 rounded small mb-0" style="white-space: pre-wrap;">${escapeHtml(ticket.notes)}</pre>` : '<p class="text-muted small">No notes</p>'}
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('checkZnunyBtn').onclick = () => checkZnuny(ticketId);
                document.getElementById('syncZnunyBtn').onclick = () => syncZnunyData(ticketId);
                new bootstrap.Modal(document.getElementById('ticketModal')).show();

            } catch (error) {
                console.error('Error loading ticket detail:', error);
            } finally {
                showLoading(false);
            }
        }

        async function checkZnuny(ticketId) {
            showLoading(true);
            try {
                const response = await fetch(`/api/tickets/${ticketId}/check-znuny`, { method: 'POST' });
                const data = await response.json();

                alert(data.in_znuny
                    ? `Ticket found in Znuny! (ID: ${data.znuny_ticket_id})`
                    : 'Ticket not found in Znuny'
                );

                loadTickets();
                if (currentTicketId === ticketId) showTicketDetail(ticketId);

            } catch (error) {
                console.error('Error checking Znuny:', error);
                alert('Error checking Znuny status');
            } finally {
                showLoading(false);
            }
        }

        async function syncZnunyData(ticketId) {
            showLoading(true);
            try {
                const response = await fetch(`/api/tickets/${ticketId}/sync-znuny`, { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    alert('Znuny data synced successfully!');
                    showTicketDetail(ticketId);
                } else {
                    alert(data.message || 'Failed to sync Znuny data');
                }

            } catch (error) {
                console.error('Error syncing Znuny:', error);
                alert('Error syncing Znuny data');
            } finally {
                showLoading(false);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
