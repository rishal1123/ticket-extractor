<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISP Ticket Formatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⚡</span>
      <div>
        <h1>ISP Ticket Formatter</h1>
        <p class="tagline">Paste a dashboard dump — get a clean, copy-ready ticket.</p>
      </div>
    </div>
    <div class="top-actions">
      <a href="/admin" class="icon-btn" title="Admin — address rules" aria-label="Admin">⚙️</a>
      <button id="theme" type="button" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="grid">
    <!-- Input panel -->
    <section class="card">
      <div class="card-head">
        <h2>Input</h2>
        <button id="clear" type="button" class="btn ghost sm">Clear</button>
      </div>
      <textarea id="input" class="box input" spellcheck="false"
                placeholder="Paste the unformatted ticket data here — it formats automatically as you type."></textarea>
    </section>

    <!-- Output panel -->
    <section class="card">
      <div class="card-head">
        <h2>Output</h2>
        <span id="badge" class="badge hidden"></span>
      </div>

      <!-- Manual-entry fields, rendered per detected ISP. -->
      <div id="manual" class="manual"></div>

      <pre id="output" class="box output" aria-live="polite"></pre>

      <div class="bar">
        <span id="status" class="status info">
          <span class="dot"></span><span class="status-text">Waiting for paste…</span>
        </span>
        <button id="copy" class="btn" disabled>
          <span class="btn-label">Copy output</span>
        </button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
